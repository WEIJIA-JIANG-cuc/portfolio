<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>阿茶的文字 — 蒋维嘉作品集</title>

<style>
  .page-header{ text-align:center; padding:88px 20px 28px; max-width:720px; margin:0 auto; }
  .section-label{ font-size:.78rem; letter-spacing:.18em; text-transform:uppercase; color:#9aa6b4; margin-bottom:10px; display:block; }
  .page-header h1{ font-size:clamp(1.6rem,4vw,2.2rem); color:#1c2733; letter-spacing:.05em; }
  .page-header p{ margin-top:14px; color:#6b7886; font-size:.92rem; line-height:1.7; }

  /* ════════════════════════════════════════════════════
     Stack · 原生复刻（白底 / 长方形 / 克莱因蓝文字卡）
     整页元素均匀分布,各部分之间 ~32px 间隔
     ════════════════════════════════════════════════════ */
  .stack-wrap{
    max-width:1700px; margin:0 auto; padding:24px 20px 48px;
    text-align:center;
    display:flex; flex-direction:column; gap:32px;
  }
  .stack-container{
    position:relative; width:min(86vw,440px); height:300px; margin:0 auto;
    perspective:900px;
  }
  .stack-card{
    position:absolute; inset:0; width:100%; height:100%;
    background:#fff; border:1px solid #e7eaf0; border-radius:14px;
    box-shadow:0 10px 30px -12px rgba(0,47,167,.18), 0 2px 8px rgba(0,0,0,.06);
    padding:18px 22px; text-align:left; cursor:grab; user-select:none;
    transform-origin:90% 90%; touch-action:none;
    display:flex; flex-direction:column;
    transition:transform .55s cubic-bezier(.34,1.56,.64,1), box-shadow .4s ease;
  }
  .stack-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
    background:var(--klein); border-radius:14px 0 0 14px;
  }
  .sc-genre{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:.68rem; letter-spacing:.1em; color:var(--klein);
    text-transform:uppercase; margin-bottom:6px; flex:0 0 auto;
  }
  .sc-title{ font-family:"SimSun",serif; font-size:1.1rem; color:#1c2733; margin-bottom:8px; letter-spacing:.02em; flex:0 0 auto; }
  .sc-body{
    position:relative;          /* 让底部 fade 蒙层定位 */
    flex:1 1 auto; min-height:0; /* 关键:允许在 flex 中收缩并撑出滚动区 */
  }
  .sc-excerpt{
    font-family:"SimSun",serif; font-size:.92rem; line-height:1.7; color:#5a6776;
    height:100%;
    overflow-y:auto; overflow-x:hidden;
    padding:2px 8px 18px 0;     /* 给滚动条+底部留空间 */
    scrollbar-width: thin; scrollbar-color: rgba(0,47,167,.35) transparent;
    -webkit-overflow-scrolling: touch;
  }
  .sc-excerpt::-webkit-scrollbar{ width:5px; }
  .sc-excerpt::-webkit-scrollbar-thumb{ background:rgba(0,47,167,.3); border-radius:3px; }
  .sc-excerpt::-webkit-scrollbar-thumb:hover{ background:rgba(0,47,167,.55); }
  .sc-excerpt::-webkit-scrollbar-track{ background:transparent; }
  /* 底部渐变:暗示「还有更多」,滚动到底后自动消失 */
  .sc-body::after{
    content:""; position:absolute; left:0; right:5px; bottom:0; height:18px;
    background:linear-gradient(to bottom, rgba(255,255,255,0), #fff 90%);
    pointer-events:none;
  }
  .sc-body.sc-bottom::after{ opacity:0; }   /* 滚到底时隐藏渐变 */
  .stack-card:active{ cursor:grabbing; }
  .stack-hint{ color:#aab4c0; font-size:.74rem; letter-spacing:.08em; }

  /* ── 更多 ── */
  .more{
    text-align:center;
    max-width:560px; margin:0 auto;
    padding:24px 16px 18px;
    border-top:1px solid #eef0f3;
    display:flex; flex-direction:column; gap:14px; align-items:center;
  }
  .more p{ color:#6b7886; font-size:.88rem; margin:0; }
  .more a{
    display:inline-block; padding:.55rem 1.4rem; background:var(--klein); color:#fff;
    border-radius:9px; text-decoration:none; font-size:.88rem; transition:opacity .2s;
  }
  .more a:hover{ opacity:.88; }

  /* ── 信封 + 信纸(继承 light.css,这里只补全 letter 内部子元素样式)── */
  /* .envelope-footer / .envelope / .letter 容器来自 light.css */
  .letter{
    text-align:left;                     /* 信纸内容左对齐,像真信 */
  }
  .letter-tag{
    display:inline-block;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    font-size:.72rem; font-weight:700; letter-spacing:.18em;
    text-transform:uppercase; color:var(--klein);
    padding-bottom:6px;
    border-bottom:1.5px solid var(--klein);
    margin-bottom:18px;
  }
  .letter-greeting{
    font-family:"SimSun","宋体","STSong",serif;
    font-size:1.4rem; font-weight:500;
    color:#1c2733; letter-spacing:.04em;
    margin-bottom:14px;
  }
  .letter-body{
    font-family:"SimSun","宋体","STSong",serif;
    font-size:1.02rem; line-height:1.95; color:#4a5765;
    margin-bottom:22px;
  }
  .letter-contact{
    border-top:1.5px solid #e8eaef;
    padding-top:16px;
    margin-bottom:18px;
  }
  .letter-contact .lc-row{
    display:flex; gap:12px; align-items:baseline;
    padding:8px 0;
    border-bottom:1px dashed #e3e7ee;
  }
  .letter-contact .lc-row:last-child{ border-bottom:none; }
  .letter-contact dt{
    flex:0 0 80px;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    color:#9aa6b4; font-weight:500;
  }
  .letter-contact dd{
    flex:1 1 auto;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    font-size:.95rem; color:#1c2733;
  }
  .letter-contact dd a{ color:var(--klein); text-decoration:none; }
  .letter-contact dd.muted{ color:#aab4c0; }
  .letter-sign{
    display:flex; justify-content:space-between; align-items:baseline;
    border-top:1.5px solid #1c2733;
    padding-top:12px; margin-top:14px;
  }
  .letter-sign .letter-name{
    font-family:"SimSun","宋体","STSong",serif;
    font-size:1.05rem; color:#1c2733;
  }
  .letter-sign .letter-date{
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    font-size:.78rem; letter-spacing:.14em;
    color:#6b7886;
  }
  .footer-copy{ margin-top:18px; text-align:center; font-size:.76rem; color:#9aa6b4; font-family:-apple-system,BlinkFang SC,'Microsoft YaHei',sans-serif; }
</style>
</head>
<body>

<!-- 页头 -->
<header class="page-header">
  <span class="section-label">Writing by 阿茶</span>
  <h1>阿茶的文字</h1>
  <p>小说、散文、碎笔——在文字里安放另一个自己。<br />拖拽或点击卡片，翻阅下一篇。</p>

<!-- Stack 文字卡墙（白底 / 长方形 / 克莱因蓝） -->
<main>
  <div class="stack-wrap">
    <div id="stack" class="stack-container"></div>
    <p class="stack-hint">在文字内上下滚动 · 拖拽或点击标题区翻阅下一篇 →</p>

    <!-- 想看更多 -->
    <div class="more">
      <p>以上为精选节选 · 完整作品集包含小说 / 短篇 / 随笔 / 散文 / 幽默片段</p>
      <a href="assets/writing/蒋维嘉（阿茶）_文字作品集.pdf" target="_blank" rel="noopener">查看完整文字作品集 PDF →</a>
    </div>
  </div>
</main>

<script>
/* ════════════════════════════════════════════════════
   原生 Stack —— 复刻 React Bits 的 Stack 组件
   · 无 React / motion 依赖，纯 JS / CSS（弹簧过渡）
   · 拖拽甩出 / 点击 → 送往底层，循环翻阅
   · 长方形白卡 + 克莱因蓝文字，配色与首页统一
   ════════════════════════════════════════════════════ */
(function(){
'use strict';

/* —— 你的文字作品（节选，与旧版写作页一致） —— */
var CARDS = [
  { genre:`原创短篇 · 科幻 · 情感 · 第一人称`, title:`《human and robot》· 寂静的花园`,
    excerpt:`我们去过寂静无人的花园。我喜欢那里的味道，空气中都弥漫着花儿绽放的喜悦，叶子也都愉快地打了卷。我喜欢置身花丛中，看着蝴蝶落在我僵硬的指节上，再看着它飞走，仿佛此刻我也体验到了鲜活的生命。而主人总是喜欢站在背阴的棚子里，从不踏入花圃半步，仿佛阳光照见了他就会死一样。他总是站在那里，支着手饶有兴趣地打量着我，像是在看自己最满意的作品。我却感觉耳朵有点烫，是太阳太晒了吗？` },
  { genre:`原创短篇 · 科幻 · 情感`, title:`《human and robot》· 雨天的毯子`,
    excerpt:`运气不好的时候，会下雨。但我也喜欢雨天裹着主人的毯子，在落地窗前看着雨滴打在窗户上再缓缓落下。主人偶尔调侃我，你也会冷吗？好吧，我确实感受不太到冷，但总觉得这样的雨天，就该这样过。主人说我喜欢看着窗外发呆，并问我到底在想什么？我说不知道。并不是我不想回答，我是真的不知道，我在想人性，想自由，想生命，想爱，想宇宙的起源与毁灭，想一切。或者在每个发愣的瞬间，我只是在想，那一滴雨水落在主人睫毛上会是什么模样？` },
  { genre:`随笔 · 青春 · 一封不会寄出的信`, title:`《无题》· 分享欲`,
    excerpt:`分享欲，是我对你最大的喜欢。旅游的时候，我也每天都给你发各种照片，我和你分享着我的一切。我给你吐槽基地没有凉白开，吐槽直角的公交车座位让人腰酸背痛，吐槽车上的空调让人内环境失调，我其实也没那么脆弱，不知道出于什么心理，就是想要和你说。我给你看早上六点的日出，给你看我高级的靠窗床位，给你看各种奇怪的南方小动物，很多微小而又雀跃的事，都被无限放大想要与你分享。和朋友过公路，看到一只鸟停在红绿灯上，第一反应是想给你拍下来，那一瞬间，我意识到自己大概是没救了吧。我想让你知道，我的热情都是用礼貌伪装的，只是因为你不一样才会跟你说一些零散的废话。` },
  { genre:`散文 · 游记 · 自然`, title:`《西双版纳》· 万类霜天竞自由`,
    excerpt:`生命就是疯狂而原始的，生存就是荒诞的，大自然就是残酷又富有魅力的。生命从不在乎自己是否美丽或是否符合人类的价值取向，它们所做的一切只是为了生存和繁衍，只是为了在这硕大的蓝色星球上寻得一片自己的立足之地罢了。我喜欢这种原始又纯粹的渴望，而热带雨林则是这些渴望的集大成者。它就像一个生命的擂台，无数生物轮番登场，展示自己的生存本领，失败就下场，成功也不一定活到最后。在这里，我看到什么叫作真正的“万类霜天竞自由”。` },
  { genre:`散文 · 游记 · 自然`, title:`《西双版纳》· 走进雨林`,
    excerpt:`十年后的今天，我终于走进了真正的热带雨林。我看见比我整个人还大很多的板根，看见残忍又绚丽的绞杀现象，看见直戳天空的高耸树木，还有许多奇奇怪怪、颜色艳丽的生物。我走在雨林中，才真正意识到，我也是自然的一部分。手上、裤腿上沾了泥，我伸手抚摸粗糙的树皮，感受那古老的生命，一只蝴蝶从我头顶飞过，四周是从未听过的婉转鸟鸣。那一刻，我好像脱掉了人类的身份——也不过是自然里的一分子。` },
  { genre:`散文 · 游记 · 自然`, title:`《西双版纳》· 还会回来`,
    excerpt:`有些知识我以前只在书里模模糊糊地见过，有些浅薄印象，经她一说，再亲眼见到实物，只觉得尤其奇妙——好像多年前读过的文字并未消失，只是静静等着，在这一刻走到我眼前来，证明它们一直存在。我想我一定还会再回来这里的。回来听听鸟鸣，看看四脚蛇怎么捉白蚁；观察小松鼠怎么转着吃松果；花一个下午看蚂蚁搬家，发着呆，猜猜那两只蝴蝶会落在哪一朵花上；再看看去年开花的那棵树，今年还开不开。回来再看看，这世上其他生灵，都在怎样活着。` }
];

var SENSITIVITY = 160;     // 拖拽多少像素算「甩出」
var RANDOM_ROT  = true;    // 每张卡随机小角度
var AUTOPLAY    = false;
var AUTO_DELAY  = 3200;

/* stack 数组：index 0 = 最底，最后 = 最顶（可交互） */
var stack = CARDS.map(function(c,i){ return { id:i, genre:c.genre, title:c.title, excerpt:c.excerpt, _r:undefined }; });
var container = document.getElementById('stack');
var elMap = {};
var topId = null;

function baseTransform(card, index, n){
  var rot = (n-1-index)*4 + (RANDOM_ROT ? (card._r||0) : 0);
  var scale = 1 + index*0.06 - n*0.06;
  return 'rotate('+rot+'deg) scale('+scale+')';
}

function build(){
  container.innerHTML='';
  elMap={};
  stack.forEach(function(card){
    if(RANDOM_ROT && card._r===undefined) card._r = Math.random()*10-5;
    var el=document.createElement('div');
    el.className='stack-card';
    el.innerHTML =
      '<span class="sc-genre">'+card.genre+'</span>'+
      '<h3 class="sc-title">'+card.title+'</h3>'+
      '<div class="sc-body"><p class="sc-excerpt">'+card.excerpt+'</p></div>';
    container.appendChild(el);
    elMap[card.id]=el;

    /* 滚动状态:滚到底时去掉底部渐变 */
    var body  = el.querySelector('.sc-body');
    var ex    = el.querySelector('.sc-excerpt');
    function checkScroll(){
      var reach = ex.scrollTop + ex.clientHeight >= ex.scrollHeight - 4;
      body.classList.toggle('sc-bottom', reach);
    }
    ex.addEventListener('scroll', checkScroll, { passive:true });
    /* 文本区内的鼠标按下不触发卡片拖拽(让滚动接管) */
    ex.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    /* 初始检查(等布局完) */
    requestAnimationFrame(checkScroll);

    attachDrag(el, card);
  });
  layout();
}

function layout(){
  var n=stack.length;
  stack.forEach(function(card,index){
    var el=elMap[card.id];
    el.style.zIndex=index+1;
    el.style.transformOrigin='90% 90%';
    el.style.transition='transform .55s cubic-bezier(.34,1.56,.64,1), box-shadow .4s ease';
    el.style.transform=baseTransform(card,index,n);
    el.style.opacity='1';
    el.style.boxShadow = index===n-1
      ? '0 18px 40px -14px rgba(0,47,167,.30), 0 3px 10px rgba(0,0,0,.08)'
      : '0 10px 30px -12px rgba(0,47,167,.18), 0 2px 8px rgba(0,0,0,.06)';
  });
  topId=stack[n-1].id;
}

function sendToBack(id){
  var idx=stack.findIndex(function(c){ return c.id===id; });
  if(idx<0) return;
  var card=stack.splice(idx,1)[0];
  stack.unshift(card);   // 移到数组最前 = 视觉最底
  layout();
}

function attachDrag(el, card){
  var dragging=false, sx=0, sy=0, dx=0, dy=0, moved=false, pid=null;

  el.addEventListener('pointerdown', function(e){
    if(card.id!==topId) return;          // 仅最顶层可交互
    dragging=true; moved=false; dx=0; dy=0;
    sx=e.clientX; sy=e.clientY; pid=e.pointerId;
    try{ el.setPointerCapture(pid); }catch(_){}
    el.style.transition='none';
    el.style.cursor='grabbing';
  });

  el.addEventListener('pointermove', function(e){
    if(!dragging) return;
    dx=e.clientX-sx; dy=e.clientY-sy;
    if(Math.abs(dx)>4||Math.abs(dy)>4) moved=true;
    var rx=dy*-0.22, ry=dx*0.22;
    el.style.transform='translate3d('+dx+'px,'+dy+'px,0) rotateX('+rx+'deg) rotateY('+ry+'deg)';
  });

  function end(){
    if(!dragging) return;
    dragging=false;
    el.style.cursor='grab';
    try{ el.releasePointerCapture(pid); }catch(_){}
    var dist=Math.max(Math.abs(dx),Math.abs(dy));
    if(dist>SENSITIVITY){
      // 甩出 → 送往底层
      el.style.transition='transform .35s ease, opacity .35s ease';
      el.style.transform='translate3d('+(dx*2.2)+'px,'+(dy*2.2)+'px,0) rotateX('+(dy*-0.4)+'deg) rotateY('+(dx*0.4)+'deg)';
      el.style.opacity='0';
      setTimeout(function(){ sendToBack(card.id); }, 320);
    } else if(moved){
      layout();                          // 没甩够 → 弹回（不换卡）
    } else {
      sendToBack(card.id);               // 纯点击 → 换下一张
    }
  }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* 自动播放（默认关） */
var autoTimer=null;
function startAuto(){
  if(!AUTOPLAY || stack.length<2) return;
  autoTimer=setInterval(function(){ if(topId!==null) sendToBack(topId); }, AUTO_DELAY);
}
function stopAuto(){ if(autoTimer){ clearInterval(autoTimer); autoTimer=null; } }
container.addEventListener('pointerenter', stopAuto);
container.addEventListener('pointerleave', startAuto);

build();
startAuto();

})();

/* ══ TrueFocus 导航：悬停聚焦 + 四角框平滑移动（与 hero 统一）══ */
(function(){
  var container=document.getElementById('tfContainer');
  var frame=document.getElementById('tfFrame');
  var words=Array.prototype.slice.call(container.querySelectorAll('.tf-word'));
  function moveFrame(word){
    var cr=container.getBoundingClientRect();
    var r=word.getBoundingClientRect();
    frame.style.left=(r.left-cr.left)+'px';
    frame.style.top=(r.top-cr.top)+'px';
    frame.style.width=r.width+'px';
    frame.style.height=r.height+'px';
    frame.classList.add('show');
  }
  function focus(word){ words.forEach(function(w){ w.classList.toggle('on', w===word); }); moveFrame(word); }
  function blur(){ words.forEach(function(w){ if(w.getAttribute('href')!=='writing.html') w.classList.remove('on'); }); frame.classList.remove('show'); }
  words.forEach(function(w){ w.addEventListener('mouseenter', function(){ focus(w); }); });
  container.addEventListener('mouseleave', blur);
})();
</script>
</body>
</html>
