  <script>
(function(root){'use strict'; const data={"version":"P0.27","questionVersion":"V1.4","ruleVersion":"A0.2","chapters":["第一章｜你好，世界","第二章｜找一个自己的地方","第三章｜把日子过起来","第四章｜另一只鸟出现了","第五章｜巢里有了新生命","第六章｜季节往前，故事往后"],"questions":[{"id":1,"title":"破壳的第一刻","scene":"蛋壳裂开了。故事里，你最想先感受到什么？","chapter":0,"options":[{"key":"A","text":"亲鸟靠过来的温暖。"},{"key":"B","text":"身边小鸟挤挤挨挨的动静。"},{"key":"C","text":"巢外吹进来的风和气味。"},{"key":"D","text":"伸伸腿，原来这就是我的身体。"}]},{"id":2,"title":"巢外是什么","scene":"羽毛渐渐长起来，你第一次能仔细看看巢外，眼前有树叶、天空和来往的影子。","chapter":0,"options":[{"key":"A","text":"往边上凑凑，想多看点新东西。"},{"key":"B","text":"缩回熟悉的位置，今天先看这里。"},{"key":"C","text":"先盯着一个影子，看清它去了哪里。"},{"key":"D","text":"先扑腾两下翅膀，外面待会儿再看。"}]},{"id":3,"title":"身边的小家伙","scene":"几只同龄的小鸟已经挤到一起活动，你会怎样加入这段热闹？","chapter":0,"options":[{"key":"A","text":"凑过去，先叫两声。"},{"key":"B","text":"自己找个位置，也能玩得挺好。"},{"key":"C","text":"有谁朝我叫，我再靠近。"},{"key":"D","text":"找其中一只，两个一起待。"}]},{"id":4,"title":"第一次起飞","scene":"翅膀已经能撑起身体，你要从现在的落脚处飞向旁边一根枝条。","chapter":0,"options":[{"key":"A","text":"先看好落点和路线，再振翅。"},{"key":"B","text":"先轻轻跳飞一下，试试翅膀的感觉。"},{"key":"C","text":"看别的鸟飞一遍，再照着试。"},{"key":"D","text":"等熟悉的鸟靠近，跟着它一起飞。"}]},{"id":5,"title":"刚才吓了一跳","scene":"初次飞行时一阵风让你晃了一下，现在已经落稳，周围也安静了。","chapter":0,"options":[{"key":"A","text":"还绷着，先在原处待一会儿。"},{"key":"B","text":"已经放松，不过还想休息一下。"},{"key":"C","text":"已经放松，想接着飞一小段。"},{"key":"D","text":"还绷着，但也想慢慢试着动起来。"}]},{"id":6,"title":"想解锁的本领","scene":"等翅膀和身体长结实，你最想拥有哪项本领？","chapter":0,"options":[{"key":"A","text":"一头扎进水里，追上游动的小鱼。"},{"key":"B","text":"在高空盘旋，看清脚下的大地。"},{"key":"C","text":"在空中灵活转弯，追上飞着的小虫。"},{"key":"D","text":"在泥土和落叶里，找出藏起来的虫子。"}]},{"id":7,"title":"理想栖息地","scene":"你开始独立活动，要为接下来的日子选一片更想待的地方。","chapter":1,"options":[{"key":"A","text":"湖边、河岸，有浅水也有芦苇。"},{"key":"B","text":"树木连成一片，枝头和林间都能去。"},{"key":"C","text":"灌木挨着草地，藏身和走动都方便。"},{"key":"D","text":"开阔的田野或山坡，视野能放得很远。"}]},{"id":8,"title":"人类住在附近","scene":"这片天地里也有人类，你更愿意把日子过在哪里？","chapter":1,"options":[{"key":"A","text":"街巷和屋檐间，习惯城市的动静。"},{"key":"B","text":"村庄和农田旁，跟着田野过四季。"},{"key":"C","text":"公园和绿地里，人来人往也有树荫。"},{"key":"D","text":"少有人到的荒野，四周主要是风声。"}]},{"id":9,"title":"安家第一天","scene":"刚到新地方，吃的、喝的和晚上落脚的地方都还没摸清。","chapter":1,"options":[{"key":"A","text":"先找齐几个关键地点，再安排怎么走。"},{"key":"B","text":"先逛起来，遇到什么就解决什么。"},{"key":"C","text":"先找一处能歇脚的，其他慢慢熟悉。"},{"key":"D","text":"沿着其他鸟常走的方向，看看哪里能停。"}]},{"id":10,"title":"鸟和鸟的距离","scene":"日子安定下来，你更向往哪一种相处方式？","chapter":1,"options":[{"key":"A","text":"身边总有一群鸟，吃饭歇脚都热闹。"},{"key":"B","text":"有一只熟悉的同伴，常常一起行动。"},{"key":"C","text":"白天各忙各的，晚上再聚到一处。"},{"key":"D","text":"大多数时候自己活动，偶尔碰个面。"}]},{"id":11,"title":"你的营业时间","scene":"如果能挑一天里最喜欢的时段，你想什么时候最活跃？","chapter":1,"options":[{"key":"A","text":"天刚亮时，抢先听见世界醒来。"},{"key":"B","text":"白天，借着亮光看清周围。"},{"key":"C","text":"黄昏，趁天色慢慢暗下来出门。"},{"key":"D","text":"夜里，在月光和暗影间活动。"}]},{"id":12,"title":"羽毛保养时间","scene":"有一段清闲，你最想试试哪种鸟类日常？","chapter":1,"options":[{"key":"A","text":"在浅水里扑腾，甩一身小水珠。"},{"key":"B","text":"在细沙里滚一滚，来场沙浴。"},{"key":"C","text":"钻过挂着雨滴的叶丛，蹭一场淋浴。"},{"key":"D","text":"迎着太阳展开羽毛，安静晒一会儿。"}]},{"id":13,"title":"今日食谱","scene":"如果可以选择适合自己的食谱，你最想把什么当作日常美食？","chapter":2,"options":[{"key":"A","text":"果子、种子这类植物食物。"},{"key":"B","text":"昆虫和土里的小虫，边找边吃。"},{"key":"C","text":"鱼虾和水里的小动物，去水边开饭。"},{"key":"D","text":"小型鸟兽等猎物，靠捕猎解决一餐。"}]},{"id":14,"title":"到手的这一口","scene":"故事里，你刚找到一份够吃的食物，还没急着下嘴。","chapter":2,"options":[{"key":"A","text":"就在这里吃，刚找到的最香。"},{"key":"B","text":"带到有遮挡的地方，自己慢慢吃。"},{"key":"C","text":"带到熟悉的鸟附近，边待着边吃。"},{"key":"D","text":"留一部分藏起来，过会儿再来找。"}]},{"id":15,"title":"有鸟来串门","scene":"常找食物的地方来了一只陌生鸟，眼下食物够你们各吃各的。","chapter":2,"options":[{"key":"A","text":"停到显眼处叫两声，留出彼此的距离。"},{"key":"B","text":"它找它的，我找我的，共用这片地方。"},{"key":"C","text":"靠近一点，回应它的动静。"},{"key":"D","text":"今天换个地方，自己活动更自在。"}]},{"id":16,"title":"落叶自己动了","scene":"一片卷起的落叶被风吹得来回滚，你还没见过它这样动。","chapter":2,"options":[{"key":"A","text":"凑近啄一下，看看会发生什么。"},{"key":"B","text":"继续走，今天对它没什么兴趣。"},{"key":"C","text":"先跟着看一段，弄清它怎么滚。"},{"key":"D","text":"叫两声，看看附近有没有鸟一起注意到。"}]},{"id":17,"title":"树上停了辆“电鸫车”","scene":"路过一棵树，乌鸫忽然唱出一段很像电动车警报的声音。","chapter":2,"options":[{"key":"A","text":"停下来听，这段也太像了。"},{"key":"B","text":"试着回应两声，跟它接个声音。"},{"key":"C","text":"找个看得清的位置，瞧瞧是谁在唱。"},{"key":"D","text":"继续赶路，今天先不围观。"}]},{"id":18,"title":"天降“白色快递”","scene":"一坨鸟粪落到刚理好的羽毛上，你有点烦。现在已经清理好，哪种状态更像你？","chapter":2,"options":[{"key":"A","text":"还觉得烦，想自己安静一会儿。"},{"key":"B","text":"已经翻篇了，接着干原来的事。"},{"key":"C","text":"还觉得烦，先做点别的缓缓。"},{"key":"D","text":"心情已经好了，换根枝头继续歇着。"}]},{"id":19,"title":"那只鸟有点可爱","scene":"树枝上停着一只圆滚滚的小鸟，你看过去，脑中最先冒出哪句话？","chapter":3,"options":[{"key":"A","text":"真可爱，好想吃。"},{"key":"B","text":"想认识一下，它会怎么回应我？"},{"key":"C","text":"我也是可爱的小鸟，不相上下。"},{"key":"D","text":"它忙它的，我躺我的。"}]},{"id":20,"title":"想要这样的声音","scene":"林子里传来各种鸟声，如果能选一种属于自己的声音，你更喜欢哪种？","chapter":3,"options":[{"key":"A","text":"快速又密集，像一串小鼓点。"},{"key":"B","text":"低沉绵长，隔一会儿来一声。"},{"key":"C","text":"清亮短促，几声就让人记住。"},{"key":"D","text":"变化丰富，偶尔还夹点拟声。"}]},{"id":21,"title":"今天唱不唱","scene":"你停在枝头，天气舒适，附近偶尔有别的鸟发出声音。","chapter":3,"options":[{"key":"A","text":"自己先唱起来，今天想发出声音。"},{"key":"B","text":"听到喜欢的叫声，再回应几下。"},{"key":"C","text":"试试没发过的新声音，自己玩一会儿。"},{"key":"D","text":"今天安静听着，不想开嗓。"}]},{"id":22,"title":"春天的示好","scene":"到了相遇的季节，如果可以选一种求偶方式，你更想怎样让对方注意到你？","chapter":3,"options":[{"key":"A","text":"找根显眼的枝头，唱一段自己的拿手曲。"},{"key":"B","text":"走到光线好的地方，亮亮漂亮的羽毛。"},{"key":"C","text":"衔着一口食物，慢慢靠近对方。"},{"key":"D","text":"多在附近待待，从彼此熟悉开始。"}]},{"id":23,"title":"暂时没有回应","scene":"你试着向喜欢的鸟示好，对方却飞去了别处，刚才有点失落。过了一会儿，你更像哪种状态？","chapter":3,"options":[{"key":"A","text":"还在意，想自己待会儿。"},{"key":"B","text":"还在意，但会先去做原本的事。"},{"key":"C","text":"已经放下了，想再去别处转转。"},{"key":"D","text":"已经放下了，先舒舒服服歇一会儿。"}]},{"id":24,"title":"两只鸟的一天","scene":"这个繁殖季，你和一只熟悉的鸟结成了伴，你更喜欢怎样相处？","chapter":3,"options":[{"key":"A","text":"大部分活动一起做，随时能看见对方。"},{"key":"B","text":"各有常去的地方，到固定时段再碰面。"},{"key":"C","text":"想到有意思的事就去找它，其他随意。"},{"key":"D","text":"一起停着也很好，不一定要做同一件事。"}]},{"id":25,"title":"想住怎样的巢","scene":"到了繁殖期，如果可以选择一种巢址，你更喜欢哪种？","chapter":4,"options":[{"key":"A","text":"树洞里，入口不大，里面自成天地。"},{"key":"B","text":"枝杈间，风和树叶都在旁边。"},{"key":"C",   function about(){return page(`<article class="about-card"><h1>借一只鸟的生命，<br>认识它的世界。</h1><p>做这个小测试的初衷，是想让大家在一段轻松的幻想旅程里，了解小鸟的一生：怎样离巢、寻找食物、遇见同伴，又怎样生活在各自的天地里。</p><p>你会遇见一只与你有些相似的小鸟，也可以顺着图鉴，看看它真实的模样、叫声和日常。如果玩过之后，你开始留意窗外的一声鸟鸣，或记住了一只以前不认识的鸟，这个小网站就有意义了。因为看见，才愿意了解；因为了解，才更愿意保护。希望大家都能喜欢小鸟，也一起保护小鸟！测试会继续免费开放。</p><h2>先叠个甲 🐦</h2><p>仅供娱乐。把小鸟的一生做成测试，难免会有拟人的说法；真实鸟类的行为，要结合物种、个体和具体情境来看。如果发现知识性错误，请告诉我，我会认真核对，立刻滑跪修改！</p><p>图鉴中的小鸟以 SVG 矢量插画呈现。绘制时使用的 AI 生成参考图，均由纯文字提示词生成，生图过程中未上传真实鸟类摄影作品作为图像参考，也没有将多张鸟图做“溶图”或拼贴合成。</p><p>插画包含艺术加工，可能存在比例、羽色或细节表达不够严谨的地方，一切以真实小鸟的样貌和可靠资料为准。每只小鸟的图鉴页都附有懂鸟和 eBird 链接，欢迎前往原站看照片、听鸣声、查资料，了解它们真实的生活。</p><p>最初的心理设定参考过八维相关思路，目前是经过简化的趣味匹配，不是完整的八维测评，也不能替代专业心理评估。把结果当作认识自己和小鸟的一个小入口就好。</p><p>如果仍有不合适的地方，欢迎友好、善意地指出。🥺 我会认真听取和核对，对需要调整的内容负责修改，也愿意沟通处理后续问题。想加入哪些新小鸟、哪里可以做得更好，都欢迎告诉我。希望和大家一起，把这个小地方慢慢完善。</p><h2>你的回答留在哪里？</h2><p>回答只保存在当前浏览器，不会自动上传。下载的答卷和分享卡由你保管。你可以随时清除本机进度；如果浏览器禁止本地存储，页面会提示，测试仍可继续。</p><button class="text-button reset-link" data-action="reset">清除本次进度并重新开始</button></article>`);}

    const out=[],nest={A:'树洞',B:'枝杈',C:'屋檐或岩隙',D:'近水草茎'}[a[24]];
    if(nest&&b.nest.length&&!b.nest.includes(nest))out.push(`你向往${nest}的巢址；${b.name}的资料记录的是${b.nestText}。这项愿望不完全相同。`);
    if(a[5]&&!(b.skill[a[5]]>=1))out.push(`你想解锁“${D.questions[5].options.find(o=>o.key===a[5]).text.replace(/[。！]$/,'')}”；它更有依据的日常动作是${b.skillText}。`);
    return out.slice(0,2);
  }
  function resultPage(){
    const answers=state.preview?sampleA:state.answers,result=C.analyze(answers);
    if(result.status==='insufficient')return review('再补充几个片段，就能写出更具体的分析。至少留下12个选择，其中包括3个人的行为场景、2个鸟生偏好，并回答栖息地或食谱中的一题。');
    const selected=state.preview?getBird(state.birdId):result.primary.bird;
    const b=selected,s=result.summary;
    const alternatives=result.ranking.filter(r=>r.bird.id!==b.id).slice(0,2);
    const similar=similarities(b,answers),diff=differences(b,answers);
    const statusNote=state.preview?'样式预览 · 使用虚构回答展示分析结构，不是你的测试结果':'趣味匹配测试版 · 你的回答只保存在本机';
    const noStory=!s.explore.direction&&!s.plan.direction;
    const resultHTML=`${state.preview?`<div class="preview-banner">${esc(statusNote)}</div>`:''}<article class="report" style="--bird-color:${b.color};--bird-pale:${b.pale}"><header class="result-hero"><div class="result-title"><h1>${esc(b.name)}</h1><p class="latin">${esc(b.latin)}</p><p class="subtitle">${esc(s.headline)}</p></div><div class="result-art">${art(b,'result')}</div></header><section class="report-chapter"><div class="chapter-heading"><h2>你的行动方式</h2></div>${s.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}<p>${esc(s.taskText)}</p></section><section class="report-chapter tinted"><div class="chapter-heading"><h2>你与世界的距离</h2></div><p>${esc(s.socialText)}</p></section><section class="report-chapter"><div class="chapter-heading"><h2>留一点自己的节奏</h2></div><p>${esc(s.moodText)}</p></section><section class="report-chapter"><div class="chapter-heading"><h2>可以试的一小步</h2></div>${s.tips.map(p=>`<div class="tip"><p>${esc(p)}</p></div>`).join('')}</section><section class="report-chapter tinted"><div class="chapter-heading"><h2>你与它，相似在哪里</h2></div>${similar.length?similar.map(p=>`<p>${esc(p)}</p>`).join(''):'<p>这次生活偏好还没有足够直接的生态对应，先把这只鸟作为一种创意提案，认识它真实的日常。</p>'}${diff.length?`<aside class="difference"><strong>也有不一样的地方</strong>${diff.map(p=>`<p>${esc(p)}</p>`).join('')}</aside>`:''}</section><section class="report-chapter"><div class="chapter-heading"><h2>认识真实的${esc(b.name)}</h2></div><ul class="fact-list">${b.facts.map(f=>`<li><span>${esc(naturalFact(f))}</span></li>`).join('')}</ul><p style="margin-top:21px">${esc(b.range)}</p>${sourceLine(b)}</section><section class="report-chapter tinted alternatives"><div class="chapter-heading"><h2>也有这两种鸟的身影</h2></div><div class="alternative-grid">${alternatives.map(r=>`<article class="near-card">${art(r.bird,'near-'+r.bird.slug)}<div><h3>${esc(r.bird.name)}</h3><p class="latin">${esc(r.bird.latin)}</p><p>${esc(r.bird.caption)}</p><button class="text-button" data-action="bird-from-result" data-bird="${r.bird.id}">认识它 ↗</button></div></article>`).join('')}</div></section><section class="report-chapter"><div class="chapter-heading"><h2>让一只鸟，走进真实生活</h2></div><p>${b.encounterText?esc(b.encounterText):`下一次路过${esc(b.habitatText.split('、')[0])}，可以留意一下有没有它的身影。暂时没遇到也没关系，从记住它的名字、认识它需要的环境开始就好。`}</p><details class="report-details"><summary>翻看我的鸟生偏好</summary><dl class="preference-list">${E.map(n=>{const a=answers[n-1],opt=a&&D.questions[n-1].options.find(o=>o.key===a);return `<div><dt>${esc(prefs[n])}</dt><dd>${opt?esc(opt.text):'这一段暂时留白'}</dd></div>`;}).join('')}</dl></details></section><div class="report-actions"><button class="button" data-action="save-card" data-bird="${b.id}">保存鸟生卡片 <span aria-hidden="true">↗</span></button>${state.preview?'<button class="button ghost" data-action="atlas">回到鸟类图鉴</button>':'<button class="button ghost" data-action="review">回看我的选择</button><button class="button ghost" data-action="export">下载答卷</button>'}</div><p class="report-end">趣味探索，不是心理诊断。生态资料有据可查，人与鸟的连接是创意类比。${!state.preview&&result.displayTie?'相近候选仍有同档，主结果是这次的阅读起点。':''}${noStory?'本次鸟种展示主要参考你向往的生活。':''}结果仍会随资料与反馈完善。</p></article>`;
    return page(resultHTML);
  }
  function render(){
    const views={home,quiz,review,atlas,detail,about,result:resultPage};
    document.body.dataset.view=state.view; app.innerHTML=(views[state.view]||home)();
    document.title=(state.view==='quiz'?`第${state.index+1}题 · `:state.view==='result'?'我的鸟生手记 · ':state.view==='atlas'?'鸟类图鉴 · ':'')+'BIRD-8';
  }
  function finish(){
    pauseTime();const result=C.analyze(state.answers);
    if(result.status==='insufficient'){state.view='review';save();app.innerHTML=review('再补充几个片段，就能写出更具体的分析。至少留下12个选择，其中包括3个人的行为场景、2个鸟生偏好，并回答栖息地或食谱中的一题。');window.scrollTo(0,0);return;}
    state.finished=true;state.chosenId=null;navigate('result',{preview:false,birdId:null});
  }
  function download(name,blob){
    const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
  }
  function exportAnswers(){
    const rows=D.questions.map((q,i)=>({question:q.id,title:q.title,answer:state.answers[i],text:state.answers[i]?q.options.find(o=>o.key===state.answers[i]).text:null}));
    const out={product:'BIRD-8',prototypeVersion:D.version,questionVersion:D.questionVersion,ruleVersion:D.ruleVersion,exportedAt:new Date().toISOString(),elapsedSeconds:Math.round(timeSpent()/1000),answers:state.answers,questions:rows,note:'本地试读答卷；没有专业心理诊断或科学准确率。'};
    download('BIRD8_V1.4_我的答卷.json',new Blob([JSON.stringify(out,null,2)],{type:'application/json;charset=utf-8'}));toast('答卷已交给浏览器下载，请在下载列表查看。');
  }
  async function saveCard(id){
    const b=getBird(id),s=C.summarize(state.preview?sampleA:state.answers),canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1440;
    const ctx=canvas.getContext('2d');if(!ctx){toast('这个浏览器暂不支持保存卡片，可用系统截图。');return;}
    ctx.fillStyle='#e0eeeb';ctx.fillRect(0,0,1080,1440);
    ctx.fillStyle='#556b57';ctx.textAlign='center';ctx.font='24px "Microsoft YaHei",sans-serif';ctx.fillText('B I R D — 8  /  一 段 鸟 生',540,92);
    ctx.fillStyle='#273d35';ctx.font='bold 90px "Microsoft YaHei",sans-serif';ctx.fillText(b.name,540,230);ctx.font='italic 31px Georgia,serif';ctx.fillStyle='#627768';ctx.fillText(b.latin,540,294);
    const svg=art(b,'detail').replace('<svg ','<svg width="1254" height="1254" '),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
    try{
      const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});ctx.drawImage(img,150,320,780,780);
      ctx.fillStyle='#273d35';ctx.font='bold 39px "Microsoft YaHei",sans-serif';
      const title=s.headline;ctx.fillText(title,540,1168,920);ctx.font='26px "Microsoft YaHei",sans-serif';ctx.fillStyle='#687962';ctx.fillText(b.tags.join('  ·  '),540,1230,900);
      ctx.fillStyle='#7a8573';ctx.font='22px "Microsoft YaHei",sans-serif';ctx.fillText(state.preview?'结果样式预览 · 虚构回答示例':'借一只鸟的生命，重新认识自己。',540,1320);
      ctx.font='18px "Microsoft YaHei",sans-serif';ctx.fillText('趣味类比 · 非心理诊断 · 鸟类插画',540,1372);
      canvas.toBlob(blob=>{if(blob){download('BIRD8_'+b.name+'_鸟生卡片.png',blob);toast('鸟生卡片已交给浏览器下载。');}else toast('暂未能生成卡片，可使用系统截图。');},'image/png');
    }catch(e){toast('暂未能生成卡片，可使用系统截图保存结果。');}finally{URL.revokeObjectURL(url);}
  }
  function resetDialog(){lastFocus=document.activeElement;const d=document.getElementById('confirm-dialog');if(d.showModal)d.showModal();else d.setAttribute('open','');}
  function closeDialog(){const d=document.getElementById('confirm-dialog');if(d.close)d.close();else d.removeAttribute('open');if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}
  function loadSample(sample){state.answers=[...sample];state.index=35;state.elapsed=0;state.started=null;state.finished=true;state.chosenId=null;navigate('result',{preview:false,birdId:null});toast('已载入虚构样例，仅用于试读。');}
  document.addEventListener('click',function(event){
    const target=event.target.closest('[data-action]');if(!target||target.disabled)return;
    const action=target.dataset.action;
    if(action==='home')navigate('home');
    else if(action==='atlas')navigate('atlas');
    else if(action==='about')navigate('about');
    else if(action==='start'){
      if(state.finished&&C.analyze(state.answers).status!=='insufficient')navigate('result',{preview:false});
      else navigate('quiz',{preview:false});
    }else if(action==='answer'){
      state.answers[state.index]=target.dataset.key;state.finished=false;state.chosenId=null;save();
      app.querySelectorAll('.option').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===target.dataset.key)));
      const next=app.querySelector('[data-action="next"]');if(next)next.disabled=false;
      const n=answerCount(),label=app.querySelector('.quiz-top span:last-child'),prog=app.querySelector('.progress');if(label)label.textContent='已回答 '+n+' / 36';if(prog){prog.setAttribute('aria-valuenow',n);prog.firstElementChild.style.width=n/36*100+'%';}
    }else if(action==='next'||action==='skip'){
      if(action==='skip'){state.answers[state.index]=null;state.finished=false;state.chosenId=null;}
      if(state.index===35){pauseTime();navigate('review');}
      else navigate('quiz',{index:state.index+1});
    }else if(action==='previous')navigate('quiz',{index:Math.max(0,state.index-1)});
    else if(action==='edit')navigate('quiz',{index:Number(target.dataset.index),preview:false});
    else if(action==='review')navigate('review',{preview:false});
    else if(action==='finish')finish();
    else if(action==='export')exportAnswers();
    else if(action==='save-card')saveCard(target.dataset.bird);
    else if(action==='bird')navigate('detail',{birdId:target.dataset.bird,backView:'atlas'});
    else if(action==='bird-from-result')navigate('detail',{birdId:target.dataset.bird,backView:'result',returnBirdId:state.birdId});
    else if(action==='back-detail')navigate(state.backView,state.backView==='result'&&state.preview?{birdId:state.returnBirdId}:{});
    else if(action==='preview')navigate('result',{preview:true,birdId:target.dataset.bird});
    else if(action==='choose-tie'){state.chosenId=target.dataset.bird;navigate('result',{preview:false});}
    else if(action==='reset')resetDialog();
    else if(action==='cancel-reset')closeDialog();
    else if(action==='confirm-reset'){
      closeDialog();pauseTime();state={answers:Array(36).fill(null),index:0,elapsed:0,started:null,finished:false,view:'home',birdId:null,backView:'atlas',preview:false,chosenId:null};
      try{localStorage.removeItem(storageKey);}catch(e){}render();window.scrollTo(0,0);toast('已清除本次进度。');
    }else if(action==='sample-a')loadSample(sampleA);
    else if(action==='sample-b')loadSample(sampleB);
    else if(action==='import'){
      const input=document.getElementById('answers-import').value.trim();
      let parsed;
      try{parsed=C.parseAnswerInput(input);}catch(e){toast(e.message);return;}
      state.answers=parsed.map(x=>x||null);state.index=35;state.elapsed=0;state.started=null;state.chosenId=null;state.finished=false;finish();
    }
  });
  document.addEventListener('keydown',event=>{
    if(state.view!=='quiz'||event.altKey||event.ctrlKey||event.metaKey||event.target.matches('input,textarea'))return;
    const letter=event.key.toUpperCase();if(['A','B','C','D'].includes(letter)){const b=app.querySelector('[data-key="'+letter+'"]');if(b){event.preventDefault();b.click();b.focus();}}
  });
  window.addEventListener('pagehide',save);
  load();render();timer=setInterval(()=>{if(state.view==='quiz')save();},15000);
  // Deliberately no analytics, network requests, cookies, account or remote form.
})();

</script>
