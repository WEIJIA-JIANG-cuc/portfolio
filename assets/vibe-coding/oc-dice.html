<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OC 灵感骰子 · 角色卡抽取器</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:#ffffff;color:#333;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:48px 16px 64px;
  }
  h1{font-size:22px;font-weight:600;letter-spacing:2px;margin-bottom:6px}
  .sub{font-size:13px;color:#999;margin-bottom:28px}

  .wrap{width:100%;max-width:440px}
  .ctrl{display:flex;gap:10px;margin-bottom:18px}
  .ctrl input{
    flex:1;border:1px solid #ddd;background:#fff;padding:10px 12px;
    border-radius:8px;font-family:inherit;font-size:14px;color:#333;
  }
  .ctrl input::placeholder{color:#bbb}
  button{
    border:none;cursor:pointer;font-family:inherit;
    background:#333;color:#fff;padding:10px 18px;border-radius:8px;
    font-size:14px;letter-spacing:1px;transition:.18s;
  }
  button:hover{background:#000}
  button.ghost{background:#fff;color:#333;border:1px solid #333}
  button.ghost:hover{background:#f2f2f2}

  .card{
    background:#fff;border:1px solid #e6e6e6;border-radius:12px;
    padding:24px;min-height:260px;
    font-family:"Songti SC","STSong","FangSong","仿宋",serif;
  }
  .card h2{text-align:center;font-size:15px;letter-spacing:2px;margin-bottom:18px;font-weight:600}
  .row{margin-bottom:13px;animation:fadeIn .5s ease both}
  .row .lab{font-size:12px;color:#c0392b;letter-spacing:2px;margin-bottom:2px;font-weight:600}
  .row .val{font-size:16px;line-height:1.5}
  .core{margin-top:16px;padding-top:12px;border-top:1px dashed #ddd;
    font-style:italic;text-align:center;font-size:15px;line-height:1.6;animation:fadeIn .7s ease both}
  .foot{margin-top:16px;text-align:center;font-size:12px;color:#bbb;letter-spacing:1px;animation:fadeIn .9s ease both}
  .tip{text-align:center;color:#ccc;font-size:13px;padding-top:90px}
  .hidden{display:none}

  .actions{display:flex;gap:10px;margin-top:16px}
  .actions button{flex:1}

  .saved{margin-top:34px;border-top:1px solid #eee;padding-top:18px}
  .saved h3{font-size:13px;color:#999;letter-spacing:2px;margin-bottom:12px;font-weight:600}
  .item{border:1px solid #eee;border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:.15s}
  .item:hover{border-color:#ccc;background:#fafafa}
  .item .t{font-size:14px;font-weight:600;margin-bottom:4px}
  .item .p{font-size:12px;color:#999;line-height:1.5}
  .item .del{float:right;font-size:12px;color:#c0392b;border:none;background:none;cursor:pointer;padding:0 4px}
  .item .del:hover{text-decoration:underline}

  .toast{
    position:fixed;left:50%;bottom:40px;transform:translateX(-50%);
    background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;
  }
  .toast.show{opacity:1}

  @keyframes fadeIn{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:translateY(0)}
  }

  /* 手机适配：更宽松的间距 + 触屏友好的按钮尺寸 */
  @media (max-width:520px){
    body{padding:26px 14px 44px}
    h1{font-size:21px;letter-spacing:1.5px}
    .sub{font-size:12px;margin-bottom:22px}
    .wrap{max-width:100%}
    .ctrl{margin-bottom:14px}
    .ctrl input,
    button{padding:13px 16px;min-height:46px;font-size:15px}
    .ctrl input{border-radius:10px}
    .card{padding:18px 16px;min-height:220px;border-radius:14px}
    .card h2{font-size:14px;margin-bottom:16px}
    .row{margin-bottom:14px}
    .row .val{font-size:16px;line-height:1.6}
    .core{font-size:15px;line-height:1.7;margin-top:14px;padding-top:14px}
    .actions{gap:12px;margin-top:14px}
    .actions button{min-height:46px}
    .saved{margin-top:28px}
    .item{padding:14px;margin-bottom:12px}
    .item .del{min-height:auto;padding:4px 8px}
    .toast{bottom:28px;font-size:14px;padding:11px 20px}
  }
  /* 桌面端也保证输入框/按钮点击舒适 */
  @media (min-width:521px){
    button,.ctrl input{min-height:42px}
  }
</style>
</head>
<body>
  <h1>OC 灵感骰子</h1>
  <div class="sub">抽一张角色种子卡，去创造一个「人」</div>

  <div class="wrap">
    <div class="ctrl">
      <input id="ocName" type="text" placeholder="给角色起个名字（可留空）" maxlength="12">
      <button onclick="draw()">抽一张</button>
    </div>

    <div class="card" id="card">
      <div class="tip" id="placeholder">— 点击上方按钮开始 —</div>
      <div id="content" class="hidden"></div>
    </div>

    <div class="actions" id="actions" style="display:none">
      <button class="ghost" onclick="copyCard()">复制文案</button>
      <button class="ghost" onclick="saveCard()">收藏这张</button>
    </div>

    <div class="saved">
      <h3 id="savedTitle">我的收藏</h3>
      <div id="savedList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

const LAB = {印象:"角色印象",内核:"气质内核",外貌:"外貌锚点",习惯:"小习惯",矛盾:"矛盾点",追求:"精神追求",恐惧:"恐惧"};
const KEYS = ["印象","内核","外貌","习惯","矛盾","追求","恐惧"];
const STORE = "oc_cards_v1";

let current = null;

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function draw(){
  const name = document.getElementById("ocName").value.trim();
  const title = name ? ("角色卡 · " + name) : ("角色卡 · 第 " + (Math.floor(Math.random()*900)+100) + " 抽");
  const lines = KEYS.map(k => ({lab:LAB[k], val:pick(BANK[k])}));
  const core = pick(BANK.内核句);
  current = {title, lines, core};
  renderCard(current);
}

function renderCard(c){
  document.getElementById("placeholder").classList.add("hidden");
  const box = document.getElementById("content");
  box.classList.remove("hidden");
  document.getElementById("actions").style.display = "flex";
  let html = `<h2>${c.title}</h2>`;
  for(const ln of c.lines){
    html += `<div class="row"><div class="lab">${ln.lab}</div><div class="val">${ln.val}</div></div>`;
  }
  html += `<div class="core">${c.core}</div>`;
  html += `<div class="foot">—— 去创造一个「人」吧 ——</div>`;
  box.innerHTML = html;
}

function copyCard(){
  if(!current) return;
  let txt = current.title + "\n";
  for(const ln of current.lines){ txt += ln.lab + "：" + ln.val + "\n"; }
  txt += "\n" + current.core;
  navigator.clipboard.writeText(txt).then(()=>toast("已复制 ✓")).catch(()=>toast("复制失败，请手动选择"));
}

function saveCard(){
  if(!current) return;
  const data = JSON.parse(localStorage.getItem(STORE) || "[]");
  data.unshift({...current, time: Date.now()});
  localStorage.setItem(STORE, JSON.stringify(data));
  renderSaved();
  toast("已收藏 ★");
}

function renderSaved(){
  const data = JSON.parse(localStorage.getItem(STORE) || "[]");
  const list = document.getElementById("savedList");
  document.getElementById("savedTitle").textContent = "我的收藏 (" + data.length + ")";
  if(!data.length){
    list.innerHTML = '<div class="tip" style="padding:14px 0">还没有收藏，抽到喜欢的就点「收藏这张」</div>';
    return;
  }
  list.innerHTML = data.map((c,i)=>{
    const prev = c.lines.slice(0,2).map(l=>l.lab+"："+l.val).join("；");
    return `<div class="item" onclick="loadSaved(${i})">
      <button class="del" onclick="event.stopPropagation();delSaved(${i})">删除</button>
      <div class="t">${c.title}</div>
      <div class="p">${prev}</div>
    </div>`;
  }).join("");
}

function loadSaved(i){
  const data = JSON.parse(localStorage.getItem(STORE) || "[]");
  const c = data[i];
  if(c){ current = c; renderCard(c); toast("已载入"); }
}

function delSaved(i){
  const data = JSON.parse(localStorage.getItem(STORE) || "[]");
  data.splice(i,1);
  localStorage.setItem(STORE, JSON.stringify(data));
  renderSaved();
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove("show"), 1400);
}

renderSaved();
</script>
