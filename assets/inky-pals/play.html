<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3edda"><title>彩墨伙伴 Inky Pals</title><style>*{box-sizing:border-box;margin:0;padding:0}
:root{--desk:#f3edda;--paper:#fffdf6;--ink:#2f4a3a;--ink-soft:#667361;--line:#d8d2bd;--green:#3c5346;--mint:#e9eddf;--coral:#e2603f;--coral-dark:#ad4325;--y:#f2cf5b;--b:#8fbcdc;--g:#b5d18e;--r:#ec8a68;--o:#f2bd6e;--p:#c5aade;--mix:#79543b;--cell:#faf7ef;--wall:#969d90}
html{height:100%;-webkit-text-size-adjust:100%}

[hidden]{display:none!important}
#app{height:100%;max-width:480px;margin:auto;padding:max(10px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));position:relative}
.screen{height:100%;display:none;min-height:0;flex-direction:column;gap:12px}
.screen.active{display:flex}
.btn{display:inline-flex;justify-content:center;align-items:center;min-height:48px;border:2px solid var(--ink);border-radius:16px;background:var(--paper);padding:10px 16px;font-weight:700;transition:transform .12s,background .12s}

.game-bar{display:grid;grid-template-columns:44px minmax(0,1fr) auto;min-height:54px}

#home{align-items:center;justify-content:center;gap:20px;padding-bottom:5vh}

.home-art .stamp:nth-child(3){transform:rotate(-3deg)}
.home-title{font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;font-size:36px;font-weight:800;letter-spacing:3px;text-align:center}
.home-english{display:block;margin-top:10px;font-family:Arial,system-ui,sans-serif;font-size:23px;font-weight:700;letter-spacing:1px;text-align:center}
.home-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:350px;margin-top:12px}
.home-row .btn{font-size:16px;min-height:54px}
.home-progress{height:18px;font-size:11px;color:var(--ink-soft)}
#select{gap:20px}

#select-groups{overflow-y:auto;min-height:0;padding:0 2px 16px;scrollbar-width:thin}
.select-group{padding:16px 14px;margin-bottom:12px;border:1.5px solid var(--line);border-radius:18px;background:var(--paper)}
.select-group:nth-child(2){background:#f4edd2}.select-group:nth-child(3){background:#e7eddf}.select-group:nth-child(4){background:#efe6dc}.select-group:nth-child(5){background:#e8e3ee}

.select-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{position:relative;aspect-ratio:1;min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-size:18px;font-weight:700}
.lv.done{border-color:#6d8765;background:#e2ebd7}.lv.done::after{content:'✓';position:absolute;bottom:3px;right:5px;font-size:10px}
.lv.perfect::after{content:'★';font-size:14px;color:#9b741e;bottom:2px;right:4px}

.select-group.extra{background:transparent}

.tool.placed small::before{content:'✓ ';color:var(--green)}
.recipes{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:4px 0 2px}
.recipe-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px 14px;min-height:22px;width:100%;max-width:100%;min-width:0}
.recipe-row>.recipe{padding:4px 6px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}
.recipe{display:inline-flex;align-items:center;gap:4px;font-size:13px;white-space:nowrap}
.recipe .op{font-size:12px;color:var(--ink-soft)}
.color-chip{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;border:1px solid rgba(47,74,58,.25);font-size:11px;font-style:normal;line-height:1;color:var(--ink)}
.b0{background:#fff}.b1{background:var(--y)}.b2{background:var(--b)}.b3{background:var(--g)}.b4{background:var(--r)}.b5{background:var(--o)}.b6{background:var(--p)}.b7{background:var(--mix)}
.b7{color:#fff;border-color:#61422e}
.rule-summary{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink-soft);font-size:11px;min-height:24px;white-space:nowrap}
.rule-summary .rule-dot{color:#b5b6a5;font-size:8px}
.rule-help{display:grid;place-items:center;width:28px;height:28px;border:1.5px solid var(--line);border-radius:50%;background:var(--paper);font-size:13px;font-weight:700;flex:none}
.legend-cell{width:18px;height:22px;border:1.5px solid var(--ink);border-radius:4px;background:var(--cell);position:relative;overflow:hidden}
.legend-cell::before{content:'';position:absolute;inset:0 0 55%;background:var(--g);border-bottom:1px solid #9caf8b}
.board-space{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center;position:relative}
#board{width:var(--board-side,320px);height:var(--board-side,320px);max-width:100%;display:grid;gap:5px;padding:8px;border:2px solid var(--line);border-radius:18px;background:#ebe6d4;flex:none;position:relative}
.cell{position:relative;min-width:0;min-height:0;border-radius:8px;background:var(--cell);border:1.2px solid #dfdac8;display:grid;place-items:center;overflow:hidden;aspect-ratio:1}
.cell.ink1{background:var(--y);border-color:#dfc359}.cell.ink2{background:var(--b);border-color:#83adc9}.cell.ink3{background:var(--g);border-color:#9ebc7c}.cell.ink4{background:var(--r);border-color:#db896c}.cell.ink5{background:var(--o);border-color:#daaf69}.cell.ink6{background:var(--p);border-color:#b59bcc}.cell.ink7{background:var(--mix);border-color:#b69d84}
.cell.clue{border:2px solid var(--ink)}
.cell.wall{background:var(--wall) repeating-linear-gradient(135deg,rgba(47,74,58,.22) 0 3px,transparent 3px 9px);border-color:#788172}
.cell .stamp{width:70%;height:70%;max-width:54px;max-height:54px;z-index:2}
.band{position:absolute;left:0;right:0;top:0;height:34%;border-bottom:1px solid rgba(47,74,58,.3);display:grid;place-items:center;font-size:clamp(9px,2.5vw,12px);line-height:1;pointer-events:none}
.band.b0{border-bottom:1.5px dashed #9fa58e}
.cell.dropped .stamp{animation:stamp-in .2s ease-out}
.cell.pop{animation:ink-in .2s ease-out}
#board.celebrate{animation:board-win .48s ease-out}
#board.perfect{border-color:#bca04a;animation:board-perfect .5s ease-out}
.hint-ghost{position:fixed;z-index:30;pointer-events:none;opacity:.9;animation:hint-place 3.4s ease-in-out both;filter:drop-shadow(0 2px 3px rgba(47,74,48,.2))}

#board .cell.hint-target{outline:3px solid var(--green);outline-offset:-4px;animation:hint-pulse .65s ease-in-out infinite}

.tool.hint-source{border-color:#9a7d27;background:#f5e8bb}
#board .cell.hint-focus{outline:3px solid #a77920;outline-offset:-4px;animation:hint-pulse .65s ease-in-out infinite}

.hint-ray{position:absolute;pointer-events:none;z-index:3;background:#68a6a8;border:1px solid #fffdf2;border-radius:4px;box-shadow:0 0 5px #fffdf2;animation:ray-reveal .28s ease-out both;animation-delay:var(--ray-delay)}
.hint-ray.row-ray{height:7px;left:-2px;right:-2px;top:calc(62% - 3px);--ray-scale:scaleX(0)}
.hint-ray.col-ray{width:7px;top:-2px;bottom:-2px;left:calc(50% - 3px);--ray-scale:scaleY(0)}
.hint-ray.hint-exclusion{background:repeating-linear-gradient(90deg,#939b8b 0 4px,transparent 4px 8px);box-shadow:none;opacity:.7}
.hint-ray.col-ray.hint-exclusion{background:repeating-linear-gradient(0deg,#939b8b 0 4px,transparent 4px 8px)}
.hint-meet{position:absolute;inset:12%;border:3px solid #b78c20;box-shadow:0 0 0 3px #fff8d6;background:#fff8d65c;border-radius:50%;z-index:4;pointer-events:none;animation:meet-reveal .4s ease-out both,meet-pulse 1.2s ease-in-out infinite;animation-delay:var(--meet-delay),calc(var(--meet-delay) + .4s)}
@keyframes ray-reveal{from{opacity:0;transform:var(--ray-scale)}to{opacity:.85;transform:scale(1)}}
@keyframes meet-reveal{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:scale(1)}}
@keyframes meet-pulse{50%{transform:scale(.87);border-color:#dfb84a}}
.actions{display:flex;justify-content:center;gap:30px;align-items:center;flex:none;padding:3px 0 2px}
.actions .icon-btn{width:56px;height:56px;border-color:var(--line);border-width:1.5px;transition:transform .12s,background .12s}
.actions .icon-btn .ui-icon{width:26px;height:26px}
.actions #btn-hint{border-color:var(--ink);background:var(--paper)}
.toast{position:fixed;z-index:25;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:min(420px,calc(100% - 32px));background:var(--ink);color:var(--paper);padding:10px 15px;border-radius:14px;font-size:12px;line-height:1.5;text-align:center;pointer-events:none}
.dialog{position:fixed;inset:0;background:rgba(47,64,48,.36);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dialog-card{width:100%;max-width:380px;max-height:calc(100% - 16px);background:var(--paper);border:2px solid var(--ink);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px;overflow:auto;position:relative}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dialog-head h2{font-size:18px;font-weight:700}
.close-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;flex:none}
.close-btn .ui-icon{width:18px;height:18px}
.dialog-card p{font-size:13px;line-height:1.9}
.dialog-actions{display:flex;gap:10px}
.dialog-actions .btn{flex:1;padding-left:10px;padding-right:10px;font-size:14px}
#howto{background:var(--desk);padding:max(12px,env(safe-area-inset-top)) 20px max(16px,env(safe-area-inset-bottom))}
#howto .dialog-card{max-width:420px;max-height:100%;height:100%;border:0;background:transparent;border-radius:0;padding:0;overflow:hidden;gap:16px}
.howto-header{display:flex;align-items:center;justify-content:space-between;flex:none;min-height:44px;font-size:13px;color:var(--ink-soft)}
.howto-header-actions{display:flex;align-items:center;gap:10px}.howto-jump{font-size:12px;text-decoration:underline;text-underline-offset:3px;min-height:36px;padding:0 4px}
.howto-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#howto-title{font-size:25px;font-weight:500;text-align:center;letter-spacing:2px}
.howto-step{min-height:160px;display:flex;align-items:center;justify-content:center;gap:12px}
.howto-text{font-size:13px!important;text-align:center;max-width:310px;line-height:1.9}
.howto-text b{font-weight:700}
.howto-nav{display:flex;align-items:center;gap:12px;flex:none}
.howto-nav .btn{flex:1}
.howto-dots{display:flex;justify-content:center;gap:6px;flex:none;padding-bottom:5px}
.howto-dots i{width:6px;height:6px;border-radius:50%;background:#d0ceb9}.howto-dots i.active{background:var(--ink);width:18px;border-radius:5px}
.howto-stamps{display:flex;justify-content:center;gap:14px}.howto-stamps>span{display:flex;align-items:center;flex-direction:column;gap:7px;font-size:11px}.howto-stamps .stamp{width:56px;height:56px}
.mini-board{display:grid;gap:3px;padding:6px;background:#ebe6d4;border:1.5px solid var(--line);border-radius:12px;width:max-content}
.mini-board .cell{width:var(--mini-cell,28px);height:var(--mini-cell,28px);border-radius:5px;pointer-events:none}
.mini-board .cell .stamp{width:88%;height:88%}.mini-board .band{font-size:9px}
.teach-ink{position:absolute;inset:0;pointer-events:none;animation:teach-spread 3.5s ease-out infinite both;animation-delay:var(--flow-delay)}
@keyframes teach-spread{0%,8%{opacity:0;transform:scale(.35)}25%,78%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(1)}}
.mini-caption{font-size:11px;text-align:center;color:var(--ink-soft);margin-top:8px}
.howto-recipes{display:flex;flex-direction:column;gap:18px;align-items:center}.howto-recipes .color-chip{width:32px;height:32px;font-size:15px}.howto-recipes .recipe{gap:10px;font-size:17px}
.feature-card{gap:18px}.feature-card .dialog-head h2{font-size:18px;line-height:1.5}.feature-example{display:flex;align-items:center;flex-direction:column;gap:15px}#feature-art{display:flex;justify-content:center;min-width:0}#feature-art .howto-recipes .color-chip{width:27px;height:27px;font-size:13px}#feature-art .howto-recipes .recipe{gap:6px}#feature-art .mini-caption{margin-top:0}.howto-step .feature-example .howto-recipes .color-chip{width:27px;height:27px}.howto-step .feature-example .howto-recipes .recipe{gap:6px}
.cell-examples{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}.cell-example{display:flex;align-items:center;gap:9px;font-size:12px}.cell-example .cell{width:48px;height:48px;pointer-events:none;flex:none}
.feature-example .cell-examples .cell-example{flex-direction:column;text-align:center;gap:6px}
.success-card{align-items:center;text-align:center;gap:16px;padding-top:28px}
.success-seal{height:76px;width:76px;display:grid;place-items:center;border:3px solid #839966;border-radius:50%;background:#e7edda;color:var(--green);animation:seal-in .3s ease-out}
.success-seal .ui-icon{width:38px;height:38px;stroke-width:2.5}
.success-card h2{font-size:25px;letter-spacing:3px;font-weight:500}
.success-card p{font-size:12px;color:var(--ink-soft)}
.success-card .dialog-actions{width:100%;margin-top:6px}.success-card .close-btn{position:absolute;right:12px;top:12px}
.perfect .success-card{border-color:#aa8c33;background:#fff9e8}
.perfect .success-seal{border-color:#c29a33;background:#f8dfa0;color:#9a7022;animation:gold-seal .72s cubic-bezier(.2,.8,.2,1) both}
.perfect #success-title{color:#8c681c}
.success-card>*:not(.success-confetti){position:relative;z-index:1}.success-card>.close-btn{position:absolute}
.success-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:22px}
.success-confetti i{position:absolute;left:var(--x);top:-18px;width:7px;height:13px;background:#cfaa45;border-radius:2px;animation:confetti-fall 1.5s ease-out both;animation-delay:calc(var(--i) * 35ms)}
.success-confetti i:nth-child(3n+1){background:var(--b);height:8px}.success-confetti i:nth-child(3n+2){background:var(--r);width:5px;transform:rotate(30deg)}
@keyframes stamp-in{from{transform:translateY(-6px) scale(1.15)}to{transform:translateY(0) scale(1)}}
@keyframes ink-in{from{opacity:.55}to{opacity:1}}
@keyframes board-win{40%{transform:scale(1.018)}100%{transform:scale(1)}}
@keyframes seal-in{from{opacity:0;transform:scale(1.3) rotate(-15deg)}to{opacity:1;transform:scale(1) rotate(-7deg)}}
@keyframes hint-place{0%{opacity:0;transform:translate(0,0) scale(.8)}12%{opacity:.95;transform:translate(0,0) scale(1.08)}45%{opacity:.9;transform:translate(var(--hint-dx),var(--hint-dy)) scale(1.08)}56%{opacity:.9;transform:translate(var(--hint-dx),var(--hint-dy)) scale(.84)}67%,85%{opacity:.8;transform:translate(var(--hint-dx),var(--hint-dy)) scale(1)}100%{opacity:0;transform:translate(var(--hint-dx),var(--hint-dy)) scale(1)}}
@keyframes hint-pulse{50%{outline-color:#c5a64d}}
@keyframes gold-seal{0%{opacity:0;transform:scale(1.7) rotate(-30deg)}48%{opacity:1;transform:scale(.92) rotate(-6deg)}70%{transform:scale(1.1) rotate(4deg)}100%{transform:scale(1) rotate(-7deg)}}

@media(max-width:370px){#app{padding-left:12px;padding-right:12px}.tool{padding:5px;gap:4px}.tool .stamp{width:36px;height:36px}.tool strong{font-size:12px}.rule-summary{font-size:10px;gap:5px}.recipe-row{gap:7px 14px}.color-chip{width:17px;height:17px}.home-title{font-size:30px}}

</style></head>
<body>
<main id="app">
  <section id="home" class="screen" aria-label="首页">
    <div class="home-art" id="home-art" aria-hidden="true"></div>
    <h1 class="home-title">彩墨伙伴<span class="home-english" lang="en">Inky Pals</span></h1>
    <div class="home-row"><button id="btn-continue" class="btn primary">开始游戏</button><button id="btn-levels" class="btn">选关</button></div>
    <p id="home-progress" class="home-progress"></p>

const SAVE_KEY='yiji-stamp-progress';

  try{const raw=localStorage.getItem(SAVE_KEY);
    if(raw){const d=JSON.parse(raw);
      if(d&&typeof d==='object'){
        if(d.curveVer===CURVE_VER&&Array.isArray(d.solvedIds)&&Array.isArray(d.demoIds)){
          const s=newSave();
          s.solvedIds=d.solvedIds.filter(x=>typeof x==='string');
          s.demoIds=d.demoIds.filter(x=>typeof x==='string');
          s.lastId=typeof d.lastId==='string'?d.lastId:null;
          s.seenHowto=d.seenHowto===true;s.howtoVer=typeof d.howtoVer==='number'?d.howtoVer:0;
          return s;}
        if(Array.isArray(d.solved)&&Array.isArray(d.demo)&&typeof d.last==='number'){
          // v1 旧档：索引→sid 一次性迁移（未知索引安全丢弃）
          const s=newSave();
          d.solved.forEach(i=>{const sid=LEGACY_INDEX_TO_SID[i];if(sid&&!s.solvedIds.includes(sid))s.solvedIds.push(sid)});
          d.demo.forEach(i=>{const sid=LEGACY_INDEX_TO_SID[i];if(sid&&!s.demoIds.includes(sid)&&!s.solvedIds.includes(sid))s.demoIds.push(sid)});
          s.lastId=LEGACY_INDEX_TO_SID[d.last]||null;
          s.seenHowto=d.seenHowto===true;s.howtoVer=typeof d.howtoVer==='number'?d.howtoVer:0;
          return s;}
      }}
  }catch(e){}
  return newSave();
}

let save=loadSave();

// 「继续游戏」的目标：上次看的主线关；若上次停在练习/暂存（不占编号的组），则回到主线第一个没打通的关卡。

function lastLevelIndex(){
  const i=idxOfSid(save.lastId);
  if(isMain(i))return i;
  const main=levels.map((l,idx)=>idx).filter(isMain);
  const next=main.find(idx=>!save.solvedIds.includes(levels[idx].sid));
  return next!==undefined?next:main.length?main[main.length-1]:0;
}
