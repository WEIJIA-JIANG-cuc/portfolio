<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摄影 — 蒋维嘉作品集</title>
<link rel="stylesheet" href="css/light.css" />
<link rel="stylesheet" href="css/tf-nav.css" />
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"SimSun","宋体","STSong",serif;
    background:#fff;color:#2a3542;overflow-x:hidden;
  }
  :root{ --klein:#002FA7; }

  /* ── TrueFocus 导航（由 css/tf-nav.css 提供，这里不再重复定义）── */

  /* ════════════════════════════════════════════════════
     DriftWall · 原生复刻（白底 / 无文字 / 原比例 / 克莱因蓝对焦）
     ════════════════════════════════════════════════════ */
  .drift-wall{
    position:fixed; inset:0; width:100%; height:100%;
    overflow:hidden; perspective:1200px; perspective-origin:50% 46%;
    background:#fff; user-select:none; -webkit-user-select:none;
    /* 边缘向白色溶解（原模板的暗角改为白场淡出） */
    --dw-edge:45%;
    -webkit-mask-image:
      radial-gradient(ellipse 80% 84% at 50% 46%, #000 var(--dw-edge), transparent 100%),
      linear-gradient(to top, #000 var(--dw-edge), transparent 100%);
    -webkit-mask-composite:source-in;
    mask-image:
      radial-gradient(ellipse 80% 84% at 50% 46%, #000 var(--dw-edge), transparent 100%),
      linear-gradient(to top, #000 var(--dw-edge), transparent 100%);
    mask-composite:intersect;
  }
  .dw-plane{
    position:absolute; top:50%; left:50%;
    display:flex; flex-direction:row;
    transform-style:preserve-3d; cursor:pointer;
    transform-origin:50% 50%; will-change:transform;
  }
  .dw-col{ position:relative; width:calc(var(--dw-tw) + var(--dw-gap)); transform-style:preserve-3d; }
  .dw-track{ display:flex; flex-direction:column; will-change:transform; transform-style:preserve-3d; }
  .dw-tile{ position:relative; display:block; width:100%; flex:0 0 auto; outline:none; transform-style:preserve-3d; }
  .dw-inner{
    position:absolute; inset:calc(var(--dw-gap)/2);
    border-radius:var(--dw-radius); overflow:hidden; background:#f1f2f5;
    opacity:.86; transform:translateZ(0); pointer-events:none;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    transition:transform .42s cubic-bezier(.22,1,.36,1), opacity .42s cubic-bezier(.22,1,.36,1), box-shadow .42s cubic-bezier(.22,1,.36,1);
  }
  .dw-inner img{
    width:100%; height:100%; object-fit:cover; display:block;
    -webkit-user-drag:none; user-select:none;
  }
/* 悬停 / 聚焦：抬升 + 满色（无边框） */
.dw-tile.is-active .dw-inner{
    opacity:1;
    transform:translateZ(var(--dw-lift));
    box-shadow:0 28px 64px -16px rgba(0,0,0,.22);
}

/* ── 点击放大 lightbox（无文字，仅照片）── */
  .lightbox{
    position:fixed; inset:0; z-index:2000; display:none;
    align-items:center; justify-content:center; padding:5vh 5vw;
    background:rgba(255,255,255,.94); cursor:zoom-out;
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  }
  .lightbox.show{ display:flex; }
  .lightbox img{ max-width:96%; max-height:90%; border-radius:10px; box-shadow:0 24px 70px rgba(0,0,0,.28); }
</style>
</head>
<body>

<!-- TrueFocus 导航（右上角弱化） -->
<nav class="tf-nav">
  <div class="tf-container" id="tfContainer">
    <a class="tf-word" href="hero.html">Home</a>
    <a class="tf-word" href="game.html">Game</a>
    <a class="tf-word" href="vibecoding.html">Vibe</a>
    <a class="tf-word" href="writing.html">Write</a>
    <a class="tf-word on" href="photography.html">Photo</a>
    <div class="tf-frame" id="tfFrame">
      <span class="c tl"></span><span class="c tr"></span>
      <span class="c bl"></span><span class="c br"></span>
    </div>
  </div>
</nav>

<!-- DriftWall 照片墙（铺满全屏 / 无文字 / 原比例） -->
<div id="driftwall" class="drift-wall">
  <div id="dwPlane" class="dw-plane"></div>
</div>

<!-- 点击放大 -->
<div id="lightbox" class="lightbox"><img alt=""></div>

<script>
/* ════════════════════════════════════════════════════
   原生 DriftWall —— 复刻 React Bits 的 DriftWall 组件
   · 无 React 依赖，纯 JS / CSS
   · 白底、无文字、按原图比例（横版横用 / 竖版竖用）
   · 悬停抬升 + 克莱因蓝对焦框，点击放大
   ════════════════════════════════════════════════════ */
(function(){
'use strict';

/* —— 你的照片（与摄影集一致的 32 张，按原比例） —— */
var PHOTOS = [
  "20240804-DSC01161.jpg",
  "20241003-DSC02053.jpg",
  "20241003-DSC02346.jpg",
  "20241003-DSC02409.jpg",
  "20241003-DSC02424.jpg",
  "20241004-DSC02581.jpg",
  "20251102-DSC00336.jpg",
  "20251102-DSC00878.jpg",
  "20251102-DSC00879.jpg",
  "20251102-DSC01039.jpg",
  "20251102-DSC01142.jpg",
  "20251102-DSC01176.jpg",
  "DSC01399-3.jpg",
  "DSC01400-已增强-4.jpg",
  "DSC01578-已增强-17.jpg",
  "DSC01639-31.jpg",
  "DSC04315.jpg",
  "DSC04860.jpg",
  "DSC04868.jpg",
  "DSC04877-1.jpg",
  "DSC04992.jpg",
  "DSC08868.jpg",
  "DSC08952.jpg",
  "DSC09801-1.jpg",
  "IMG_20240802_154417.jpg",
  "IMG_20240802_155910.jpg",
  "中国传媒大学-蒋维嘉-北京奥林匹克森林公园-休息一下鸭.jpg",
  "中国传媒大学-蒋维嘉-北京奥林匹克森林公园-误入水草深处.jpg",
  "中国传媒大学-蒋维嘉-北京奥林匹克森林公园-进食的蜂鸟鹰蛾.jpg",
  "中国传媒大学-蒋维嘉-大连渔人码头-鸥皇.jpg",
  "中国传媒大学-蒋维嘉-大连莲花山观景台-林中鹿.jpg",
  "中国传媒大学-蒋维嘉-新疆伊犁地区某草原-马群.jpg"
];

/* —— 配置（对应 React Bits 的 props） —— */
var TILE_W   = 190;   // 每列瓦片宽（横版以此为准，竖版按比例算高）
var GAP      = 14;
var RADIUS   = 14;
var LIFT     = 72;
var SPEED    = 38;    // 漂移速度 px/s
var VARIANCE = 0.5;   // 列间速度差
var DIRECTION= 'up';
var PERSPECTIVE = 1200;
var TILT     = 14;    // rotateX
var TURN     = -12;   // rotateY
var DEPTH    = 140;
var PARALLAX = 0.7;
var PAUSE_ON_HOVER = false;
var FADE     = 0.55;

var BASE = 'assets/photography/';

function pickColumns(w){
  if(w>=1600) return 8;
  if(w>=1300) return 7;
  if(w>=1000) return 6;
  if(w>=720)  return 5;
  if(w>=520)  return 4;
  return 3;
}
function columnFactor(index, variance){
  var pseudo = ((index*0.6180339887 + 0.35) % 1) * 2 - 1;
  return 1 + variance * pseudo;
}

var container = document.getElementById('driftwall');
var plane = document.getElementById('dwPlane');
var lightbox = document.getElementById('lightbox');

/* CSS 变量（瓦片尺寸） */
container.style.setProperty('--dw-tw', TILE_W+'px');
container.style.setProperty('--dw-gap', GAP+'px');
container.style.setProperty('--dw-radius', RADIUS+'px');
container.style.setProperty('--dw-lift', LIFT+'px');
container.style.setProperty('--dw-edge', ((1-FADE)*100)+'%');

var aspects = {};          // path -> w/h
var colData = [];          // 每列 {items:[{path,h}], repeatHeight, copies}
var colEls=[], trackEls=[];
var offsets=[], vels=[];
var activeId=null, hoveredCol=-1, wallHover=false;
var pointer={x:0,y:0}, damped={x:0,y:0}, lastTs=null, raf=null;
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var curCols = pickColumns(window.innerWidth);

/* 1) 预加载测宽高比（保证横/竖比例准确、零裁切） */
function measureAll(){
  return Promise.all(PHOTOS.map(function(p){
    return new Promise(function(res){
      var im=new Image();
      im.onload=function(){ aspects[p] = im.naturalWidth/im.naturalHeight || 1.5; res(); };
      im.onerror=function(){ aspects[p] = 1.5; res(); };
      im.src = BASE+p;
    });
  }));
}

/* 2) 构建列与瓦片 */
function build(){
  plane.innerHTML='';
  colEls=[]; trackEls=[];
  var cols = Array.from({length:curCols}, function(){ return []; });
  PHOTOS.forEach(function(p,i){ cols[i%curCols].push(p); });

  colData = cols.map(function(col){
    var items = col.map(function(p){
      var ar = aspects[p] || 1.5;
      return { path:p, h: TILE_W/ar };   // 瓦片高 = 宽 / 宽高比 → 比例不变
    });
    var repeatHeight = items.reduce(function(s,it){ return s+it.h+GAP; },0) - GAP;
    var copies = Math.max(2, Math.ceil((container.clientHeight*1.8)/repeatHeight)+1);
    return { items:items, repeatHeight:repeatHeight, copies:copies };
  });

  colData.forEach(function(cd,c){
    var colEl=document.createElement('div'); colEl.className='dw-col';
    var track=document.createElement('div'); track.className='dw-track';
    for(var copy=0; copy<cd.copies; copy++){
      cd.items.forEach(function(it,idx){
        var tile=document.createElement('div');
        tile.className='dw-tile';
        tile.setAttribute('data-tile-id', c+'-'+copy+'-'+idx);
        tile.setAttribute('data-col', c);
        tile.setAttribute('data-path', it.path);
        tile.setAttribute('role','button');
        tile.tabIndex=0;
        tile.style.height=(it.h+GAP)+'px';
        var inner=document.createElement('div'); inner.className='dw-inner';
        var img=document.createElement('img');
        img.src=BASE+it.path; img.alt=''; img.draggable=false; img.loading='lazy';
        inner.appendChild(img); tile.appendChild(inner);
        track.appendChild(tile);
      });
    }
    colEl.appendChild(track); plane.appendChild(colEl);
    colEls.push(colEl); trackEls.push(track);
  });

  offsets = colData.map(function(cd,c){ return cd.repeatHeight*((c*0.37)%1); });
  vels = colData.map(function(){ return 0; });
}

/* 3) 动画 */
function applyPlane(){
  plane.style.transform =
    'translate(-50%,-50%) scale(1.18) ' +
    'rotateX('+(TILT+damped.y)+'deg) rotateY('+(TURN+damped.x)+'deg) ' +
    'translateZ('+(-DEPTH)+'px)';
}
function baseVel(c){
  var dirSign = DIRECTION==='up'?1:-1;
  var alt = c%2===0 ? 1 : -1;
  return SPEED * columnFactor(c,VARIANCE) * dirSign * alt;
}
function loop(ts){
  raf = requestAnimationFrame(loop);
  if(lastTs===null) lastTs=ts;
  var dt = Math.min(0.05, Math.max(0,(ts-lastTs)/1000)); lastTs=ts;

  var maxT = PARALLAX*8;
  var tx = pointer.x*maxT, ty = -pointer.y*maxT;
  var dmp = 1-Math.exp(-dt/0.12);
  damped.x += (tx-damped.x)*dmp;
  damped.y += (ty-damped.y)*dmp;
  applyPlane();

  if(!reduced){
    for(var c=0;c<colData.length;c++){
      var cd=colData[c];
      var paused = wallHover && PAUSE_ON_HOVER;
      var factor = (paused || hoveredCol===c) ? 0 : 1;
      var target = baseVel(c)*factor;
      var ease = 1-Math.exp(-dt/(target===0?0.16:0.28));
      vels[c] += (target-vels[c])*ease;
      var next = offsets[c] + vels[c]*dt;
      next = ((next % cd.repeatHeight) + cd.repeatHeight) % cd.repeatHeight;
      offsets[c]=next;
      trackEls[c].style.transform = 'translate3d(0,'+(-next)+'px,0)';
    }
  } else {
    for(var k=0;k<colData.length;k++) trackEls[k].style.transform='translate3d(0,'+(-offsets[k])+'px,0)';
  }
}

/* 4) 悬停对焦 + 点击放大 */
function setActive(id){
  activeId=id;
  if(id===null) hoveredCol=-1;
  plane.querySelectorAll('.dw-tile.is-active').forEach(function(t){ t.classList.remove('is-active'); });
  if(id){
    var t=plane.querySelector('[data-tile-id="'+id+'"]');
    if(t) t.classList.add('is-active');
  }
}
function tileAt(x,y){
  var hit=document.elementFromPoint(x,y);
  return (hit && hit.closest) ? hit.closest('.dw-tile') : null;
}
container.addEventListener('pointermove', function(e){
  var r=container.getBoundingClientRect();
  if(!reduced){
    pointer.x=(e.clientX-r.left)/r.width-0.5;
    pointer.y=(e.clientY-r.top)/r.height-0.5;
  }
  var tile=tileAt(e.clientX,e.clientY);
  if(!tile){ setActive(null); return; }
  var id=tile.getAttribute('data-tile-id');
  if(id!==activeId){ activeId=id; hoveredCol=Number(tile.getAttribute('data-col')); setActive(id); }
});
container.addEventListener('pointerenter', function(){ wallHover=true; });
container.addEventListener('pointerleave', function(){ wallHover=false; pointer.x=0; pointer.y=0; setActive(null); });
container.addEventListener('click', function(e){
  var tile=tileAt(e.clientX,e.clientY);
  if(tile) openLightbox(tile.getAttribute('data-path'));
});
/* 键盘可达 */
container.addEventListener('keydown', function(e){
  if(e.key!=='Enter' && e.key!==' ') return;
  var tile=document.activeElement;
  if(tile && tile.classList && tile.classList.contains('dw-tile')){
    e.preventDefault(); openLightbox(tile.getAttribute('data-path'));
  }
});

function openLightbox(path){
  lightbox.querySelector('img').src = BASE+path;
  lightbox.classList.add('show');
}
lightbox.addEventListener('click', function(){ lightbox.classList.remove('show'); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') lightbox.classList.remove('show'); });

/* 5) 响应式：列数跨档时重建 */
window.addEventListener('resize', function(){
  var nc=pickColumns(window.innerWidth);
  if(nc!==curCols){
    curCols=nc;
    if(raf) cancelAnimationFrame(raf);
    build(); lastTs=null; raf=requestAnimationFrame(loop);
  }
});

/* 6) 启动 */
measureAll().then(function(){
  build();
  raf=requestAnimationFrame(loop);
});

})();

/* ══ TrueFocus 导航：悬停聚焦 + 四角框平滑移动（与 hero 统一）══ */
(function(){
  var container=document.getElementById('tfContainer');
  var frame=document.getElementById('tfFrame');
  var words=Array.prototype.slice.call(container.querySelectorAll('.tf-word'));
  function moveFrame(word){
    var cr=container.getBoundingClientRect();
    var r=word.getBoundingClientRect();
    frame.style.left=(r.left-cr.left)+'px';
    frame.style.top=(r.top-cr.top)+'px';
    frame.style.width=r.width+'px';
    frame.style.height=r.height+'px';
    frame.classList.add('show');
  }
  function focus(word){
    words.forEach(function(w){ w.classList.toggle('on', w===word); });
    moveFrame(word);
  }
  function blur(){
    words.forEach(function(w){ if(w.getAttribute('href')!=='photography.html') w.classList.remove('on'); });
    frame.classList.remove('show');
  }
  words.forEach(function(w){
    w.addEventListener('mouseenter', function(){ focus(w); });
  });
  container.addEventListener('mouseleave', blur);
})();
</script>
</body>
</html>
